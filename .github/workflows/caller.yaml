name: Mobile Test Orchestrator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch iOS suite
        id: dispatch
        uses: step-security/workflow-dispatchv@1
        with:
          workflow: Mobile App Tester
          repo: EduardoMejiaDev/target-repo
          ref: main
          inputs: '{ "platform": "ios", "app_name": "MyApp", "version": "2.4.1", "build_number": "42", "run_tests": true }'
          token: ${{ secrets.DISPATCH_TOKEN }}
          wait-for-completion: true
          sync-status: true

      - name: iOS outcome
        if: always()
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          echo "## iOS Test Suite" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: [${{ steps.dispatch.outputs.runUrlHtml }}](${{ steps.dispatch.outputs.runUrlHtml }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            echo "**Result:** ✅ All iOS checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result:** ❌ iOS suite failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  test-android:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android suite
        id: dispatch
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Mobile App Tester
          repo: EduardoMejiaDev/target-repo
          ref: main
          inputs: '{ "platform": "android", "app_name": "MyApp", "version": "2.4.1", "build_number": "42", "run_tests": true }'
          token: ${{ secrets.DISPATCH_TOKEN }}
          wait-for-completion: true
          sync-status: true

      - name: Android outcome
        if: always()
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          echo "## Android Test Suite" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: [${{ steps.dispatch.outputs.runUrlHtml }}](${{ steps.dispatch.outputs.runUrlHtml }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "success" ]; then
            echo "**Result:** ✅ All Android checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result:** ❌ Android suite failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  test-invalid:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch invalid request
        id: dispatch
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Mobile App Tester
          repo: EduardoMejiaDev/target-repo
          ref: main
          inputs: '{ "platform": "windows", "app_name": "", "version": "abc", "build_number": "0", "run_tests": false }'
          token: ${{ secrets.DISPATCH_TOKEN }}
          wait-for-completion: true
          sync-status: true

      - name: Invalid outcome
        if: always()
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          echo "## Invalid Request (validation gate)" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: [${{ steps.dispatch.outputs.runUrlHtml }}](${{ steps.dispatch.outputs.runUrlHtml }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = "failure" ]; then
            echo "**Result:** ✅ Correctly rejected — validation gate works" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Rejected for:" >> "$GITHUB_STEP_SUMMARY"
            echo "- platform 'windows' (must be ios or android)" >> "$GITHUB_STEP_SUMMARY"
            echo "- version 'abc' (must be semver)" >> "$GITHUB_STEP_SUMMARY"
            echo "- build_number 0 (must be >= 1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result:** ⚠️ Unexpected success — validation may have a gap" >> "$GITHUB_STEP_SUMMARY"
          fi
